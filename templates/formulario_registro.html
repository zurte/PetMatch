<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Formulário com Flask</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <h1>Cadastro de Usuário</h1>
        <!-- O método POST envia os dados de forma segura ao servidor -->
        <form id="formulario_usuario" method="POST">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"  required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email"  required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"  required><br><br>

            <label for="telefone">Número de telefone</label><br>
            <input type="tel" id="telefone" name="telefone"  required><br><br>

            <label for="CPF">CPF:</label><br>
            <input type="text" id="CPF" name="CPF  required"><br><br>

            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade"  required><br><br>

            <label for="cep">Insirá seu cep</label>
            <input type="text" id="cep" name="cep" autocomplete="postal-code" required><br><br>

            <button id="adicionar_usuario">Enviar Dados</button>
        </form>

    
    </body>
</html>
