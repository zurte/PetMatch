<!DOCTYPE html>
<html lang="pt-br"> 
    <head> 
        <meta charset="UTF-8">
        <title>PetMatch</title> 
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head> 
    <body>
        <div>
            <nav>
                <h1>PetMatch</h1>
                <ul>
                    <li><button><a href="/adocao">Adoção</a></button></li>
                    <li><button><a href="/doacao">doação</a></button></li>
                </ul>
            </nav>
            <div>
                {%if animais%}
                    
                        <h2>Pets para adoção</h2>
                        {% for animal in animais %}
                        <form action="{{url_for('detalhes_animal', id=animal[0])}}" method="GET">
                            <div id="{{animal[0]}} " name="{{animal[0]}}" class="card-animal">
                                <button type="submit" class="card-animal-button">
                                    <h2>{{animal[1]}}</h2>
                                    <img src="{{animal[2]}}" alt="imagem do animal">
                                    <p>idade: {{animal[3]}} {{animal[4]}}</p>
                                    <p>raca: {{animal[5]}}</p>
                                    <p>sexo: {{animal[6]}}</p>
                                    <p>cor: {{animal[7]}}</p><br><br>
                                </button>
                            </div>
                        </form>
                        {%endfor%}
                {%endif%}
            </div>
        </div>
    </body> 
</html>
