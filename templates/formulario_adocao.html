<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Animal</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>

        <h1>Cadastro de animal para adoção</h1>

        <form action="/adicionar_animal" method="POST" enctype="multipart/form-data">

            <!-- Nome -->
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>


            <!-- Idade -->
            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" min="0" required>

            <select id="idade_unidade" name="idade_unidade">
                <option value="meses">Meses</option>
                <option value="anos">Anos</option>
            </select><br><br>
            
            
            <!-- Raça -->
            <label for="raca_id">Raça:</label><br>

            <select id="raca_id" name="raca_id" required>
                <option value="">Selecione uma raça</option>

                <optgroup label="Gatos">
                    <option value="2">Persa</option>
                    <option value="33">Siamês</option>
                    <option value="34">Maine Coon</option>
                    <option value="35">Bengal</option>
                    <option value="36">Ragdoll</option>
                    <option value="37">Sphynx</option>
                    <option value="38">British Shorthair</option>
                    <option value="39">Scottish Fold</option>
                    <option value="40">Angorá</option>
                    <option value="41">Azul Russo</option>
                    <option value="42">Abissínio</option>
                    <option value="43">American Shorthair</option>
                    <option value="44">Norueguês da Floresta</option>
                    <option value="45">Sagrado da Birmânia</option>
                    <option value="46">Oriental</option>
                    <option value="47">SRD (Sem raça definida)</option>
                </optgroup>

                <optgroup label="Cachorros">
                    <option value="5">Yorkshire</option>
                    <option value="48">Labrador Retriever</option>
                    <option value="49">Golden Retriever</option>
                    <option value="50">Poodle</option>
                    <option value="51">Bulldog Francês</option>
                    <option value="52">Bulldog Inglês</option>
                    <option value="53">Shih Tzu</option>
                    <option value="54">Pug</option>
                    <option value="55">Beagle</option>
                    <option value="56">Dachshund</option>
                    <option value="57">Pinscher</option>
                    <option value="58">Maltês</option>
                    <option value="59">Chihuahua</option>
                    <option value="60">Border Collie</option>
                    <option value="61">Pastor Alemão</option>
                    <option value="62">Spitz Alemão</option>
                    <option value="63">Rottweiler</option>
                    <option value="64">Husky Siberiano</option>
                    <option value="65">Boxer</option>
                    <option value="66">Dálmata</option>
                    <option value="67">Cocker Spaniel</option>
                    <option value="68">Basset Hound</option>
                    <option value="69">São Bernardo</option>
                    <option value="70">Pit Bull</option>
                    <option value="71">SRD (Sem raça definida)</option>
                </optgroup>

                <optgroup label="Papagaios">
                    <option value="1">Africano</option>
                </optgroup>

                <optgroup label="Hamsters">
                    <option value="3">Sírio</option>
                    <option value="75">Roborovski</option>
                    <option value="76">Chinês</option>
                </optgroup>

                <optgroup label="Cobras">
                    <option value="4">Jiboia</option>
                    <option value="78">Píton-real</option>
                </optgroup>

                <optgroup label="Coelhos">
                    <option value="6">Mini Lop</option>
                    <option value="7">Netherland Dwarf</option>
                    <option value="8">Lionhead</option>
                    <option value="72">Mini Rex</option>
                    <option value="73">Angorá</option>
                    <option value="74">Holandês</option>
                </optgroup>

                <optgroup label="Porquinhos-da-índia">
                    <option value="9">Abissínio</option>
                    <option value="10">Peruano</option>
                    <option value="11">Inglês</option>
                    <option value="77">Texel</option>
                </optgroup>

                <optgroup label="Tartarugas">
                    <option value="12">Tigre-dagua</option>
                    <option value="13">Orelha-vermelha</option>
                </optgroup>

                <optgroup label="Jabutis">
                    <option value="14">Jabuti-piranga</option>
                    <option value="15">Jabuti-tinga</option>
                </optgroup>

                <optgroup label="Peixes">
                    <option value="16">Betta</option>
                    <option value="17">Goldfish</option>
                    <option value="18">Guppy</option>
                </optgroup>

                <optgroup label="Calopsitas">
                    <option value="19">Cinza</option>
                    <option value="20">Lutino</option>
                    <option value="21">Arlequim</option>
                </optgroup>

                <optgroup label="Canários">
                    <option value="22">Belga</option>
                    <option value="23">Roller</option>
                </optgroup>

                <optgroup label="Periquitos">
                    <option value="24">Australiano</option>
                    <option value="25">Inglês</option>
                </optgroup>

                <optgroup label="Furões">
                    <option value="26">Doméstico</option>
                </optgroup>

                <optgroup label="Chinchilas">
                    <option value="27">Padrão cinza</option>
                    <option value="28">Bege</option>
                    <option value="29">Mosaico</option>
                </optgroup>

                <optgroup label="Ratos">
                    <option value="30">Twister</option>
                </optgroup>

                <optgroup label="Lagartos">
                    <option value="31">Gecko-leopardo</option>
                    <option value="32">Dragão-barbudo</option>
                    <option value="79">Iguana-verde</option>
                </optgroup>

            </select><br><br>



            <!-- Sexo -->
            <label for="sexo_id">Sexo:</label><br>

            <select id="sexo_id" name="sexo_id" required>
                <option value="">Selecione o sexo</option>
                <option value="1">Macho</option>
                <option value="2">Fêmea</option>
            </select><br><br>


           
            <!-- Cor -->
            <label for="cor_id">Cor:</label><br>

            <select id="cor_id" name="cor_id" required>
                <option value="">Selecione a cor</option>

                <option value="1">Verde</option>
                <option value="2">Branco</option>
                <option value="3">Marrom</option>
                <option value="4">Amarelo</option>
                <option value="5">Preto</option>
                <option value="6">Cinza</option>
                <option value="7">Caramelo</option>
                <option value="8">Creme</option>
                <option value="9">Dourado</option>
                <option value="10">Azul</option>
                <option value="11">Laranja</option>
                <option value="12">Rajado</option>
                <option value="13">Malhado</option>
                <option value="14">Tricolor</option>
                <option value="15">Bege</option>
                <option value="16">Rosa</option>
                <option value="17">Preto e branco</option>
                <option value="18">Cinza e branco</option>
            </select><br><br>



            <!-- Peso -->
            <label for="peso_valor">Peso:</label><br>

            <input type="number" id="peso_valor" name="peso_valor"
                   step="0.01" min="0">

            <select id="peso_unidade" name="peso_unidade">
                <option value="g">Gramas</option>
                <option value="kg">Quilogramas</option>
            </select><br><br>


            <!-- Castrado -->
            <input type="checkbox" id="castrado" name="castrado" value="1">

            <label for="castrado">Animal castrado?</label><br><br>


            <!-- Vacinação e medicação -->
            <label for="vacinacao_medicacao">Vacinação e medicação:</label><br>

            <select id="vacinacao_medicacao" name="vacinacao_medicacao">
                <option value="medicado">medicado</option>
                <option value="vacinado">vacinado</option>
            </select><br><br>


            <!-- Status de adoção -->
            <label for="status_adocao">Status de adoção:</label><br>

            <select id="status_adocao" name="status_adocao">
                <option value="Disponível">Disponível</option>
                <option value="Em processo de adoção">Em processo de adoção</option>
                <option value="Adotado">Adotado</option>
            </select><br><br>


            <!-- Imagem -->
            <label for="imagem">Fotografia do animal:</label><br>

            <input type="file" id="imagem" name="imagem"
                   accept="image/png, image/jpeg"><br><br>


            <button type="submit">Cadastrar animal</button>

        </form>
        {% if mensagem_sucesso %}
            <p>{{ mensagem_sucesso }}</p>
        {% endif %}

        <script src="{{ url_for('static', filename='script/script.js') }}"></script>

    </body>
</html>
